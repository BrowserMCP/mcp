name: MCP Observatory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  mcp-observatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: KryptosAI/mcp-observatory/action@main
        with:
          target: mcp-observatory.target.json
          deep: true
          security: true
          comment-on-pr: true
